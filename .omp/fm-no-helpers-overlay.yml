autolearn:
  enabled: false
eval:
  py: false
  js: false
  tools:
    enabled: false
tools:
  xdev: false
images:
  blockImages: true
  describeForTextModels: false
spelling:
  autocomplete: off
skillful: false
compaction:
  enabled: false
