# Mnemopi text-only recall; bin/fm-spawn.sh's header owns launch scope.
# Each local embedding helper loads one copy of the model per session (about
# 1 GB); retain memory with text-only recall until upstream shares the model:
# https://github.com/can1357/oh-my-pi/issues/9908
# Verified against omp 18.6.3 (`omp config list --json`).
mnemopi:
  noEmbeddings: true

retry:
  # Avoid interactive reserve confirmation; reset-derived waits remain subject to
  # the inherited retry.maxDelayMs ceiling (five minutes by default; 0 disables it).
  # Native retry retains the destination's own model-fallback policy.
  enabled: true
  usageAwareFallback: true
  usageReservePct: 0
  usageReservePolicy: auto
  waitForUsageReset: false
