# Mnemopi text-only recall; bin/fm-spawn.sh's header owns launch scope.
# Each local embedding helper loads one copy of the model per session (about
# 1 GB); retain memory with text-only recall until upstream shares the model:
# https://github.com/can1357/oh-my-pi/issues/9908
# Verified against omp 18.6.3 (`omp config list --json`).
mnemopi:
  noEmbeddings: true
retry:
  # Native credential rotation is available in omp 18.6.1; inspect pooled
  # headroom rather than quota-axi's single Codex account before routing away.
  enabled: true
  usageAwareFallback: true
  usageReservePct: 0
  usageReservePolicy: auto
  waitForUsageReset: false
  modelFallback: false
  # Unattended workers may use only the selected matrix rule's fallback chain,
  # supplied by fm-spawn as a later per-task overlay, never an ambient chain.
  fallbackChains:
    default: []
