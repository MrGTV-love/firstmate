# Mnemopi text-only recall; bin/fm-spawn.sh's header owns launch scope.
# Each local embedding helper loads one copy of the model per session (about
# 1 GB); retain memory with text-only recall until upstream shares the model:
# https://github.com/can1357/oh-my-pi/issues/9908
# Verified against omp 18.6.3 (`omp config list --json`).
mnemopi:
  noEmbeddings: true
# Worker-only judge routing; global operator settings remain untouched.
# The per-task overlay and credential extension decide whether it is usable.
modelRoles:
  judge: typesafe/jev-latest
retry:
  # Native credential rotation is available in omp 18.6.1; inspect pooled
  # headroom rather than quota-axi's single Codex account before routing away.
  enabled: true
  usageAwareFallback: true
  usageReservePct: 0
  usageReservePolicy: auto
  waitForUsageReset: false
  modelFallback: false
  # Unattended workers may use only the selected matrix rule's fallback chain,
  # supplied by fm-spawn as a later per-task overlay, never an ambient chain.
  fallbackChains:
    default: []
    judge: []
# The Jev guard may spend up to 300 seconds judging one write or edit call
# (bin/ten-levels/extensions/report.ts). omp refuses a call whose tool_call
# handler outlasts this deadline, 30 seconds by default, so the deadline stays
# above that budget.
# Verified against omp 18.12.0 (`omp config list`).
extensionHandlers:
  toolCallTimeoutMs: 330000
# Auto QA (xd://report_issue) uploads every pending grievance off the machine,
# so workers keep it off and omp's tool prompt never offers the device; the Jev
# guard still refuses it (docs/configuration.md "Jev guard").
# Verified against omp 18.12.6 (`dev.autoqa`).
dev:
  autoqa: false
# omp's read, grep and ast-grep fetch URL paths by default. Workers reach the
# web only through a web-classed tool that the task's egress grant admits
# (docs/configuration.md "Jev guard"), so URL paths fail with omp's own
# "URL reads are disabled by settings." error.
# Verified against omp 18.12.4 by tests/fm-jev-guard-omp-live-e2e.test.sh.
fetch:
  enabled: false
