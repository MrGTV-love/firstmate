# Firstmate session posture for omp (Oh My Pi), passed as `--config` on every
# Firstmate-launched omp session (crewmate, scout, and secondmate alike) by
# bin/fm-spawn.sh, whose header owns why the launch carries it. It is the omp
# analogue of the Pi adapter's `--tui-mode regular` pin: a per-launch overlay,
# never a write to the captain's own ~/.omp/agent/config.yml, which stays
# exactly as the captain set it (model roles, theme, providers, compaction).
# Each key below pins one setting whose captain-facing value would park an
# unattended worker on an interactive prompt, change its pinned model under it,
# or make its composer unreadable to bin/fm-composer-lib.sh. Verified against
# omp 18.1.11's own settings schema (`omp config list`); the fallback keys against
# omp 18.8.7 by tests/fm-omp-fallback-chain-live-e2e.test.sh.
composer:
  # Pins the bare `❯` (U+276F) row for predictable worker rendering.
  # omp live-reloads this overlay, so removing the pin also changes sessions
  # already running on this path; see the omp box-composer evidence in
  # docs/verification/runtime-backends.md for the verified fallback behavior.
  shape: borderless
plan:
  # `plan.defaultOnStartup: true` opens every session read-only; a worker that
  # cannot edit files sits on its brief forever.
  defaultOnStartup: false
prewalk:
  # Prewalk swaps the active model for the `smol` role after the first edit, so
  # a worker pinned with --model would silently change model mid-task.
  enabled: false
retry:
  # `confirm` pops a dialog when a usage window runs low; `auto` lets omp fall
  # through the fallback chain without a keystroke.
  usageReservePolicy: auto
  # A session on the strongest class never falls to a weaker model, and fleet
  # agents never run on OpenRouter, so the Sol chain is empty: when the
  # recorded model fails, the run stops with the provider's error instead of
  # moving on. The global chain for this model once continued to a weaker one,
  # which stranded a lane there after a provider error burst. omp merges
  # overlays key by key and replaces an array whole, so this entry replaces that
  # one chain and leaves every other chain as the operator set it. The
  # session's live-model record (bin/fm-omp-live-model.ts) carries the stop to
  # the supervisor, and a stand-in is chosen at dispatch or relaunch.
  fallbackChains:
    openai-codex/gpt-6.1-sol: []
  # omp's own way back to the recorded model, for every chain that remains: the
  # next prompt after the primary's suppression window ends restores it.
  # `never` would leave a session on its fallback until someone changes the
  # model by hand.
  fallbackRevertPolicy: cooldown-expiry
