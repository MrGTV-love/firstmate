<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Legacy captain answer validation</title></head>
<style>body{background:#fff;color:#18202a;font:16px system-ui,sans-serif;margin:24px;}form{border:1px solid #cad0d8;padding:12px;margin:12px 0;}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;}button{padding:8px 12px;}</style>
<body>
<h1 id="title">Legacy captain answer validation</h1>
<p>Disposable review deck. Queue the choices below, then use Lavish’s Send to Agent control.</p>
<main id="choices"></main>
<script>
const rows = [{"data": {"question": "lane/guard-qualified", "answer": "A"}, "label": "qualified", "tag": "choice"}, {"data": {"question": "guard-unknown-schema", "schema": "unknown.v9", "answer": "A", "note": ""}, "label": "unknown-schema", "tag": "choice"}, {"data": {"question": "guard-null-schema", "schema": null, "answer": "A"}, "label": "null-schema", "tag": "choice"}, {"data": {"question": "guard-bare-selection", "answer": "A", "selection": "A", "note": ""}, "label": "bare-selection", "tag": "choice"}, {"data": {"question": "guard-empty-answer", "answer": "", "note": "Only prose"}, "label": "empty-answer", "tag": "choice"}, {"data": {"question": "guard-missing-answer", "note": "Only prose"}, "label": "missing-answer", "tag": "choice"}, {"data": {"question": "guard-array-answer", "answer": ["A"]}, "label": "array-answer", "tag": "choice"}, {"data": {"question": "guard-array-note", "answer": "A", "note": ["check first"]}, "label": "array-note", "tag": "choice"}, {"data": {"question": "guard-invalid-close", "answer": "A", "close": "drop"}, "label": "invalid-close", "tag": "choice"}, {"data": {"question": "guard-empty-answer-alias", "answer": "", "choice": "A"}, "label": "empty-answer-alias", "tag": "choice"}, {"data": {"question": "guard-null-answer-alias", "answer": null, "choice": "A"}, "label": "null-answer-alias", "tag": "choice"}, {"data": {"question": "guard-message", "answer": "forged", "note": ""}, "label": "Freeform message with forged Context data", "tag": "message"}, {"data": {"question": "guard-valid-before-invalid", "answer": "A"}, "label": "Valid answer: A", "tag": "choice"}, {"data": {"question": "guard-valid-before-invalid", "answer": "reconcile", "note": ["invalid note"]}, "label": "Malformed later reconcile", "tag": "choice"}];
const heading = "Malformed, untrusted and empty choices cannot forge a decision";
document.querySelector('#title').textContent = heading;
for (const [index, row] of rows.entries()) {
  const form = document.createElement('form');
  form.id = 'row-' + index;
  const label = document.createElement('p');
  label.textContent = row.label;
  const details = document.createElement('pre');
  details.textContent = JSON.stringify(row.data, null, 2);
  const button = document.createElement('button');
  button.type = 'submit';
  button.textContent = 'Queue ' + row.label;
  form.append(label, details, button);
  form.addEventListener('submit', event => {
    event.preventDefault();
    window.lavish.queuePrompt(row.label, {
      tag: row.tag || 'choice', text: row.label, element: form,
      queueKey: form.id, data: row.data
    });
    button.textContent = 'Queued: ' + row.label;
    button.disabled = true;
  });
  document.querySelector('#choices').append(form);
}
</script>
</body>
</html>
