<!--
Drop-in guard for a Lavish board that carries forms. Paste this script into the board once.
An uncancelled submit can navigate the artifact frame and lose the entered answer.
This guard cancels a submit that reaches its document listener without already being cancelled,
shows a visible error, and attempts to queue a form-error prompt when the Lavish SDK is available.
The visible notice remains if the SDK is absent or queuePrompt throws.
See bin/fm-procevent-lavish.sh's header for the syntax check and live-script guard-marker warning.
-->
<script data-fm-lavish-form-guard>
(function () {
  document.addEventListener("submit", function (event) {
    if (event.defaultPrevented) return;
    event.preventDefault();
    var form = event.target;
    var question = (form && form.getAttribute && form.getAttribute("data-lavish-question")) || "";
    var notice = document.createElement("div");
    notice.setAttribute("role", "alert");
    notice.style.cssText = "margin:8px 0;padding:8px 12px;border:2px solid #b00020;background:#fff0f0;color:#600010;font:14px/1.4 sans-serif";
    notice.textContent = "This answer was NOT recorded: the form's page script is broken. Tell the agent" +
      (question ? " (form " + question + ")." : ".");
    (form && form.appendChild ? form : document.body).appendChild(notice);
    try {
      if (window.lavish && window.lavish.queuePrompt) {
        window.lavish.queuePrompt("Form " + question + " failed: its page script is broken and no answer was queued", {
          tag: "form-error",
          text: "Form failed: " + question,
          element: form,
          data: { question: question, error: "handler-broken" }
        });
      }
    } catch (ignored) { /* the visible notice above already stands */ }
  }, false);
})();
</script>
