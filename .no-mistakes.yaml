# Per-repo no-mistakes overrides.

# firstmate is an agent-orchestration repo: its AGENTS.md installs a fleet-captain
# identity. Disable project-level agent settings/instructions for gate agents so a
# no-mistakes review/fix/document/test/lint/pr/rebase/ci agent never adopts that
# identity or drives the fleet. Trusted-only: a pushed branch cannot turn this off,
# so it is honored only from the default-branch copy of this file. Layered above
# gate-context lifecycle boundary (bin/fm-gate-refuse-lib.sh) and the
# HEAD-continuity guard; see docs/architecture.md "No-mistakes gate authority boundary."
disable_project_settings: true

# The rebase step integrates newer main into a run by merge instead of rewriting
# the submitted commits, so that step keeps the submitted head an ancestor of the
# published head. CI merge-conflict repair does not read this setting and can
# still rewrite history (tracked as nm-ci-fix-conflict-repair-merge-strategy).
# Trusted-only: honored from the default-branch copy of this file.
# docs/architecture.md "Event-driven supervision" owns the run-binding rule.
rebase:
  strategy: merge

# Trusted documentation placement policy for the Document step.
# The audience inventory and coding guideline own the detail; keep this as a
# pointer so gate instructions cannot become a second prose policy.
document:
  instructions: |
    Read docs/documentation-audiences.md and its machine-consumed
    docs/documentation-audiences.json inventory before changing documentation.
    Apply the knowledge-placement policy in
    .agents/skills/firstmate-coding-guidelines/SKILL.md.
    For changed prose, verify audience, authoritative owner, current relevance,
    evidence destination, and unique safety facts, then review the complete
    branch diff again after every documentation or lint fix.

# Pin lint to the same owner CI invokes instead of leaving it to no-mistakes'
# default handling, which does not invoke the repository's canonical lint gate.
# `bin/fm-lint.sh` owns dependency-selected, cached local ShellCheck analysis and
# workflow lint via pinned actionlint in `bin/fm-lint-workflows.sh`.
# `tests/fm-lint.test.sh` exercises source selection and reuse;
# `tests/fm-lint-report.test.sh` exercises finding parity;
# `tests/fm-lint-workflows.test.sh` exercises malformed workflow rejection.
#
# Keep commands.test absent; the firstmate-coding-guidelines skill owns this policy.
commands:
  lint: 'bin/fm-lint.sh'

# Publish each run's test evidence to the orphan no-mistakes/evidence branch linked from the PR.
# The evidence is not committed to the feature or default branch.
test:
  instructions: |
    Keep local validation targeted and fast: CI owns broad deterministic regression coverage.
    Run only the checks, new or modified test files, or targeted commands that directly exercise the changed behavior in this diff.
    Never run broad, unrelated, or multi-hundred-case regression suites locally when CI will run them.
    For documentation, skill, or comment-only changes, run only `bin/fm-doc-audience-check.sh` plus any specific check added or modified by the PR; skip unrelated bash test suites and live labs.
    Run every test command synchronously in the foreground: never launch test suites in background shells or background log-watching loops, which cause overlapping log writes and premature completion polls.
    Only spin up a Herdr or tmux lab when the diff directly changes Herdr, tmux, or primary-lifecycle behavior.
    When a live Herdr scenario is needed, run it only through `bin/fm-herdr-lab.sh` with a named non-default `fm-lab-*` session (read `docs/herdr-backend.md` and the `bin/fm-herdr-lab.sh` header for exact mechanics), and tear it down in the same evidence turn; never touch the live default Herdr session or fleet panes.
    When a real primary is needed inside the gate, provision a disposable lab home with `eval "$(bin/fm-lab-home.sh env)"`, start the harness CLI on the lab's private tmux socket (`env -u NO_MISTAKES_GATE -u FM_GATE_REFUSE_BYPASS -u FM_ROOT_OVERRIDE -u FM_STATE_OVERRIDE -u FM_DATA_OVERRIDE -u FM_CONFIG_OVERRIDE -u FM_PROJECTS_OVERRIDE tmux -L fm-lab new-session -d -s primary -c "$PWD" -e FM_HOME="$FM_HOME" <cli>`), drive and stop it only via `tmux -L fm-lab`, and tear it down in the same turn with the exact teardown line `bin/fm-lab-home.sh env` printed to stderr.
    If a required harness CLI or login is unavailable, report the scenario untested; never fake the CLI, login, or evidence.
    Do not mutate the operator primary checkout, real fleet `FM_HOME` state, or production credentials (never sign in, sign out, re-login, or edit credential stores), and keep git changes otherwise inside the run worktree.
    A user-opted-in live check may use the machine's normal Claude login; Claude's own session and transcript files under the home directory are expected and are not credential mutations.
    Ship or scout briefs that drive Herdr lifecycle still require `--herdr-lab` at scaffold time; these Test-agent instructions are not a substitute for that brief flag.
  evidence:
    store_in_repo: true

protected_paths:
  - ".gitignore"
  - ".ignore"
