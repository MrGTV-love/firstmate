name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # A manual run runs the full suite on any ref. Giving a base replays the test
  # selection for the diff from that revision to the commit being run instead,
  # which previews what a pull request of that diff would run.
  workflow_dispatch:
    inputs:
      base:
        description: Replay the selection for the diff from this revision (empty runs the full suite)
        required: false
        default: ''

permissions:
  contents: read

# Per-PR supersession: a new push to the same PR replaces that PR's in-flight
# CI instead of letting superseded heads keep the full hosted-runner fan-out.
# The group uses the PR number for pull_request events, so every run of one PR
# shares a group, and falls back to the ref for push events, so every main push
# shares one group. A group holds one running and one pending run; a newer
# pending push run replaces the older pending one, so a burst of merges queues
# one full run for the newest commit instead of one run per merge. Cancellation
# stays limited to pull_request events, so the running main run always finishes.
# Evidence and rationale: the September 12 Actions starvation report, section 3
# "Workflow mechanics to ship first".
# The compliance workflow deliberately keeps its own event-specific groups; do
# not collapse it onto this simpler shape.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Timeout policy: docs/fm-test-portable-shards.md "Timeouts" owns the three
# tiers and their rationale; tests/fm-ci-workflow.test.sh guards this workflow.
# Each job comment identifies the tier implemented by its executable value.

jobs:
  # Decides which behavior-test jobs a pull request needs. A push to main, a
  # manual run, a pull request labeled ci-full and any selector trouble run the
  # full suite; otherwise only the tests the diff can affect run, packed into as
  # few shards as their work needs. A job the plan leaves out is skipped, which
  # GitHub reports as a skipped (not a pending) check. bin/fm-test-select.py
  # owns how the selection is made, bin/fm-test-run.sh --plan-ci owns the job
  # plan, and docs/fm-test-portable-shards.md "Change-based test selection"
  # owns the rules and how to force a full run.
  plan:
    name: Test selection plan
    runs-on: ubuntu-latest
    # Fast tier: the selector reads the tree once, seconds of work.
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      selection: ${{ steps.plan.outputs.selection }}
      parallel_1: ${{ steps.plan.outputs.parallel_1 }}
      parallel_2: ${{ steps.plan.outputs.parallel_2 }}
      herdr: ${{ steps.plan.outputs.herdr }}
      serial_count: ${{ steps.plan.outputs.serial_count }}
      any_lane: ${{ steps.plan.outputs.any_lane }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select the tests this change can affect
        id: plan
        env:
          FM_EVENT_NAME: ${{ github.event_name }}
          FM_FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-full') }}
          FM_REPLAY_BASE: ${{ inputs.base }}
        run: |
          set -eu
          dir="$RUNNER_TEMP/fm-plan"
          mkdir -p "$dir"
          force=
          base=
          if [ "$FM_EVENT_NAME" = workflow_dispatch ] && [ -n "$FM_REPLAY_BASE" ]; then
            # A manual replay of the selection for a chosen diff.
            base=$FM_REPLAY_BASE
          elif [ "$FM_EVENT_NAME" != pull_request ]; then
            force="a $FM_EVENT_NAME run always runs the full suite"
          elif [ "$FM_FULL_LABEL" = true ]; then
            force="the ci-full label asks for the full suite"
          elif git rev-parse --verify --quiet 'HEAD^2' >/dev/null; then
            # A pull request checks out the merge of its head into the base, so
            # the first parent is the base the diff is taken against.
            base=$(git rev-parse HEAD^1)
          else
            force="the checkout is not a pull request merge commit"
          fi
          if [ -n "$force" ]; then
            python3 bin/fm-test-select.py --full "$force" >"$dir/decision" || true
          else
            python3 bin/fm-test-select.py --base "$base" >"$dir/decision" || true
          fi
          mode=$(sed -n 's/^mode=//p' "$dir/decision" | head -n 1)
          reason=$(sed -n 's/^reason=//p' "$dir/decision" | head -n 1)
          case "$mode" in
            selected) ;;
            *)
              mode=full
              reason="${reason:-the selector printed no decision}"
              ;;
          esac
          : >"$dir/selection"
          if [ "$mode" = selected ]; then
            sed -n 's/^test=//p' "$dir/decision" >"$dir/selection"
            bin/fm-test-run.sh --plan-ci --select-file "$dir/selection" >"$dir/plan"
            if [ "$(sed -n 's/^mode=//p' "$dir/plan" | head -n 1)" != selected ]; then
              # The plan refused the selection (a selected test no lane owns).
              mode=full
              reason="$(sed -n 's/^reason=//p' "$dir/plan" | head -n 1)"
              : >"$dir/selection"
            fi
          else
            bin/fm-test-run.sh --plan-ci >"$dir/plan"
          fi
          {
            printf 'mode=%s\n' "$mode"
            grep -E '^(parallel_1|parallel_2|herdr|serial_count|any_lane)=' "$dir/plan"
            printf 'selection<<FM_SELECTION_END\n'
            cat "$dir/selection"
            printf 'FM_SELECTION_END\n'
          } >>"$GITHUB_OUTPUT"
          {
            printf '### Test selection\n\n'
            printf -- '- mode: %s\n' "$mode"
            printf -- '- reason: %s\n' "$reason"
            if [ "$mode" = selected ]; then
              printf -- '- selected tests: %s\n' "$(grep -c . "$dir/selection" || true)"
            else
              printf -- '- selected tests: all\n'
            fi
            grep -E '^(parallel_1|parallel_2|herdr|serial_count)=' "$dir/plan" | sed 's/^/- /; s/=/: /'
          } >>"$GITHUB_STEP_SUMMARY"

  lint:
    name: Lint ${{ matrix.partition }}
    runs-on: ubuntu-latest
    # Normal tier (see the timeout policy above).
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          # New time-limit literals compare against the default-branch merge-base.
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # Single owner of the lint definition (shell file set, config, version,
      # and GitHub workflow lint). Do not re-spell the checks here; keep CI
      # and the pre-push gate on this script so a self-broken ci.yml still
      # fails locally before merge.
      - name: Lint canonical partition
        env:
          # Fail closed rather than lint uncapped when a configured per-root
          # bound (wall deadline or memory rlimit) cannot be enforced here.
          FM_LINT_REQUIRE_BOUNDS: '1'
          FM_LINT_JOBS: '1'
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-lint"
          bin/fm-lint.sh --partition "${{ matrix.partition }}of${{ strategy.job-total }}" \
            --telemetry "$RUNNER_TEMP/fm-lint/partition-${{ matrix.partition }}.tsv"
      - name: Upload lint telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-lint-telemetry-${{ matrix.partition }}
          path: |
            ${{ runner.temp }}/fm-lint/partition-${{ matrix.partition }}.tsv
            ${{ runner.temp }}/fm-lint/partition-${{ matrix.partition }}.roots.tsv
          if-no-files-found: warn

  # Deterministic proof that portable parallel shards + portable serial + Herdr
  # equal the complete tests/*.test.sh inventory with no missing or duplicates,
  # and that the portable serial CI shards partition that serial lane exactly.
  test-coverage:
    name: Test coverage guard
    runs-on: ubuntu-latest
    # Fast tier: the coverage guard is a seconds-long local computation.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Prove complete regression partition
        run: bin/fm-test-run.sh --check-coverage
      # The guard audit's Stage 0 machine: a registered hook path that does not
      # exist, a registry path that does not resolve, or a retired guard named
      # again in live code fails here instead of silently claiming coverage.
      - name: Prove guard wiring and retirement references
        run: bin/fm-guard-refcheck.sh
      - name: Enforce the guard registry contract and its ratchet
        run: bin/fm-guard-lint.sh --mode enforce --counts
      # New work cannot add debt: a refusal site on a changed line must map to a
      # guard, and the burn-down allowlist may not grow against the PR base.
      - name: Enforce the guard ratchet against the pull request base
        if: github.event_name == 'pull_request'
        run: bin/fm-guard-lint.sh --mode new-or-touched --base HEAD^1

  # Two duration-balanced portable parallel shards of the Phase 2 proven-isolated
  # set only. Composition owner: bin/fm-test-run.sh (docs/fm-test-portable-shards.md).
  tests-portable-parallel-1:
    name: Behavior portable parallel 1
    needs: plan
    if: needs.plan.outputs.parallel_1 == 'true'
    runs-on: ubuntu-latest
    # Normal tier (see the timeout policy above).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install tasks-axi, Pi and TypeScript for the Pi extension tests
        uses: ./.github/actions/npm-tools
        with:
          packages: tasks-axi @earendil-works/pi-coding-agent typescript
      - name: Check the installed tools
        run: |
          set -eu
          tasks-axi --version
          tsc --version
      - name: Write the test selection
        env:
          FM_PLAN_MODE: ${{ needs.plan.outputs.mode }}
          FM_PLAN_SELECTION: ${{ needs.plan.outputs.selection }}
        run: |
          set -eu
          if [ "$FM_PLAN_MODE" = selected ]; then
            mkdir -p "$RUNNER_TEMP/fm-plan"
            printf '%s\n' "$FM_PLAN_SELECTION" >"$RUNNER_TEMP/fm-plan/selection"
            echo "FM_CI_SELECTION_FILE=$RUNNER_TEMP/fm-plan/selection" >>"$GITHUB_ENV"
          fi
      - name: Run portable parallel shard 1
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          # A pull request that selected tests narrows the lane to them; the
          # full suite (push, manual, ci-full, any doubt) passes no selection.
          select_args=()
          if [ -n "${FM_CI_SELECTION_FILE:-}" ]; then
            select_args=(--select-file "$FM_CI_SELECTION_FILE")
          fi
          # Three scripts at a time: the lane is exactly the proven-isolated
          # set, whose recorded four-way proof ran on macOS with two members
          # not passing (docs/fm-test-isolation-proof.md). The first three-wide
          # run on the 26.04 image passed; docs/fm-test-portable-shards.md
          # cites it. --jobs must match PORTABLE_PARALLEL_JOBS, which the
          # coverage guard packs into min(jobs, PORTABLE_PARALLEL_EFFECTIVE_JOBS)
          # bins and tests/fm-ci-workflow.test.sh enforces.
          bin/fm-test-run.sh --lane portable-parallel-1 --jobs 3 \
            --fail-on-gate-skip 'Pi extension typecheck prerequisite not found' \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-portable-parallel-1.json" \
            ${select_args[@]+"${select_args[@]}"}
      - name: Upload shard 1 timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-portable-parallel-1
          path: ${{ runner.temp }}/fm-test/fm-test-timing-portable-parallel-1.json
          if-no-files-found: warn

  tests-portable-parallel-2:
    name: Behavior portable parallel 2
    needs: plan
    if: needs.plan.outputs.parallel_2 == 'true'
    runs-on: ubuntu-latest
    # Normal tier (see the timeout policy above).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
