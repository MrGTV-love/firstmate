      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install tasks-axi
        uses: ./.github/actions/npm-tools
        with:
          packages: tasks-axi
      - name: Check tasks-axi
        run: tasks-axi --version
      - name: Write the test selection
        env:
          FM_PLAN_MODE: ${{ needs.plan.outputs.mode }}
          FM_PLAN_SELECTION: ${{ needs.plan.outputs.selection }}
        run: |
          set -eu
          if [ "$FM_PLAN_MODE" = selected ]; then
            mkdir -p "$RUNNER_TEMP/fm-plan"
            printf '%s\n' "$FM_PLAN_SELECTION" >"$RUNNER_TEMP/fm-plan/selection"
            echo "FM_CI_SELECTION_FILE=$RUNNER_TEMP/fm-plan/selection" >>"$GITHUB_ENV"
          fi
      - name: Run portable parallel shard 2
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          # A pull request that selected tests narrows the lane to them; the
          # full suite (push, manual, ci-full, any doubt) passes no selection.
          select_args=()
          if [ -n "${FM_CI_SELECTION_FILE:-}" ]; then
            select_args=(--select-file "$FM_CI_SELECTION_FILE")
          fi
          bin/fm-test-run.sh --lane portable-parallel-2 --jobs 3 \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-portable-parallel-2.json" \
            ${select_args[@]+"${select_args[@]}"}
      - name: Upload shard 2 timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm-test-timing-portable-parallel-2
          path: ${{ runner.temp }}/fm-test/fm-test-timing-portable-parallel-2.json
          if-no-files-found: warn

  # Required portable serial remainder: watcher, lock, AFK, tmux, daemon,
  # ambiguous, and other stateful tests. Real Herdr stays in tests-herdr.
  # Split across separate runners so no two of these stateful scripts ever share
  # a machine: each shard is still strictly serial in itself. Shard membership
  # and the shard count both belong to bin/fm-test-run.sh, which refuses a lane
  # whose "ofN" disagrees with it (docs/fm-test-portable-shards.md).
  #
  # One job per shard rather than a matrix, so that a shard the plan does not
  # need is a skipped job under its own name and still reports (a skipped job
  # satisfies a required check, whereas a skipped matrix job reports once under
  # its unexpanded name). A full-suite run plans all 25 shards; a selection
  # plans the first N. tests/fm-ci-workflow.test.sh holds the 25 jobs identical
  # but for their number, and equal to the lanes bin/fm-test-run.sh defines.
  tests-portable-serial-1:
    name: Behavior portable serial 1
    needs: plan
    if: fromJSON(needs.plan.outputs.serial_count) >= 1
    runs-on: ubuntu-latest
    # Normal tier (see the timeout policy above).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: ./.github/actions/portable-serial-shard
        with:
          shard: 1
          total: ${{ needs.plan.outputs.serial_count }}
          mode: ${{ needs.plan.outputs.mode }}
          selection: ${{ needs.plan.outputs.selection }}

  tests-portable-serial-2:
