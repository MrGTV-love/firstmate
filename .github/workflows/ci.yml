name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests-portable-serial:
    name: Behavior portable serial ${{ matrix.shard }} - DO NOT MERGE diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [7, 8]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pinned ShellCheck
        run: |
          set -eu
          bin/fm-install-shellcheck.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned actionlint
        run: |
          set -eu
          bin/fm-install-actionlint.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Require tmux for e2e tests
        run: |
          set -eu
          command -v tmux
          tmux -V
      - name: Install tasks-axi for backlog-handoff delegation
        run: |
          set -eu
          npm install -g tasks-axi
          tasks-axi --version
      - name: Install the Pi package for the Pi extension tests
        run: |
          set -eu
          npm install -g @earendil-works/pi-coding-agent
          npm ls -g --depth 0 @earendil-works/pi-coding-agent
      - name: Install diagnostic clone and cleanup observers
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y strace
          mkdir -p "$RUNNER_TEMP/fm-seed-diagnostics"
          real_git=$(command -v git)
          real_rm=$(command -v rm)
          real_strace=$(command -v strace)
          real_date=$(command -v date)
          real_cat=$(command -v cat)
          {
            printf '#!/usr/bin/env bash\n'
            printf 'real_git=%q\nreal_strace=%q\nreal_date=%q\nreal_cat=%q\nlogs=%q\n' "$real_git" "$real_strace" "$real_date" "$real_cat" "$RUNNER_TEMP/fm-seed-diagnostics"
            cat <<'SH'
          if [ "${1:-}" != clone ]; then exec "$real_git" "$@"; fi
          trace="$logs/clone-$$.trace"
          printf -v args '%q ' "$@"
          printf '%s git pid=%s ppid=%s args=%s\n' "$("$real_date" +%s.%N)" "$$" "$PPID" "$args" >> "$logs/clone.calls"
          "$real_strace" -f -tt -s 512 -e trace=%file,%process -o "$trace" "$real_git" "$@"
          rc=$?
          if [ "$rc" -ne 0 ]; then
            printf 'FAILED CLONE rc=%s args=%s trace=%s\n' "$rc" "$args" "$trace" >&2
            "$real_cat" "$trace" >&2
          fi
          exit "$rc"
          SH
          } > bin/git
          {
            printf '#!/usr/bin/env bash\n'
            printf 'real_rm=%q\nreal_strace=%q\nreal_date=%q\nlogs=%q\n' "$real_rm" "$real_strace" "$real_date" "$RUNNER_TEMP/fm-seed-diagnostics"
            cat <<'SH'
          trace="$logs/rm-$$.trace"
          printf -v args '%q ' "$@"
          printf '%s rm pid=%s ppid=%s args=%s\n' "$("$real_date" +%s.%N)" "$$" "$PPID" "$args" >> "$logs/rm.calls"
          exec "$real_strace" -f -tt -s 512 -e trace=%file,%process -o "$trace" "$real_rm" "$@"
          SH
          } > bin/rm
          chmod +x bin/git bin/rm
          git --version
          uname -a
          id
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"
      - name: Run portable serial shard ${{ matrix.shard }}
        env:
          FM_SERIAL_LANE: portable-serial-${{ matrix.shard }}of9
          FM_SERIAL_SHARD: ${{ matrix.shard }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/fm-test"
          bin/fm-test-run.sh --lane "$FM_SERIAL_LANE" \
            --fail-on-gate-skip 'Pi extension typecheck prerequisite not found' \
            --json "$RUNNER_TEMP/fm-test/fm-test-timing-portable-serial-${FM_SERIAL_SHARD}.json"
      - name: Upload seed syscall and cleanup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-seed-diagnostics-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/fm-seed-diagnostics/
            ${{ runner.temp }}/fm-test/
          if-no-files-found: warn
