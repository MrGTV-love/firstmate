name: Require no-mistakes
run-name: "PR #${{ github.event.pull_request.number }} body compliance - ${{ github.event.action }} - event ${{ github.run_number }} (run ${{ github.run_id }})"

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

# GitHub concurrency groups retain at most one pending run, replacing older
# pending runs even when cancel-in-progress is false. Give body-bearing events
# an immutable per-event group so first-time-fork approvals can never collapse
# opened/edited checks. Keep synchronize/reopened coalescing as before.
concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    if: >-
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Record tested merge tree
        id: tested-tree
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          base=$(git rev-parse 'HEAD^1')
          printf 'tree=%s\nbase=%s\n' "$tree" "$base" >> "$GITHUB_OUTPUT"
          printf '%s %s\n' "$tree" "$base" > "$RUNNER_TEMP/fm-tested-tree"
      - name: Upload tested merge tree
        uses: actions/upload-artifact@v4
        with:
          name: fm-tested-tree-${{ steps.tested-tree.outputs.tree }}-base-${{ steps.tested-tree.outputs.base }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fm-tested-tree
          if-no-files-found: error
      - name: Verify no-mistakes signature and pipeline attestation
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@f6441c96c352a18b9cadcaef6b6c7017e9ac3970 # v1.80.1
        with:
          exempt-authors: kunchenguid,stonemonk2
